name: Deploy GitHub Pages (approved)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studybuddy-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_APP_ENV: ${{ vars.STUDYBUDDY_APP_ENV }}
      PUBLIC_API_URL: ${{ vars.STUDYBUDDY_API_URL }}
      STUDYBUDDY_DEPLOY_TARGET: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Validate expected public API URL
        run: |
          node --input-type=module -e '
            const api = process.env.PUBLIC_API_URL || "";
            const u = new URL(api);
            if(u.protocol !== "https:" || u.origin !== api || u.hostname.endsWith(".supabase.co") || u.username || u.password) {
              console.error("STUDYBUDDY_API_URL must be the HTTPS Vercel API origin");process.exit(1)
            }
            if(!["testbed", "production"].includes(process.env.PUBLIC_APP_ENV)) process.exit(1);
          '
      - run: node scripts/security-guard.mjs
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check:demo
      - name: Check API is ready before build
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 25 "$PUBLIC_API_URL/api/health" |
            node -e 'let b="";process.stdin.on("data",c=>b+=c);process.stdin.on("end",()=>{const d=JSON.parse(b);if(!d.ok || !d.databaseConfigured || d.environment!==process.env.PUBLIC_APP_ENV)process.exit(1);console.log("API ready")})'
      - name: Compile static client
        run: npm run build --workspace frontend
      - name: Check frontend asset budget
        run: npm run build:budget
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Release reviewed static artifact
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
