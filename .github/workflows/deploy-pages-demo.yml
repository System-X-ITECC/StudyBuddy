
name: Deploy GitHub Pages (approved)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studybuddy-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Verify API and build static frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PUBLIC_APP_ENV: ${{ vars.STUDYBUDDY_APP_ENV }}
      PUBLIC_API_URL: ${{ vars.STUDYBUDDY_API_URL }}
      STUDYBUDDY_DEPLOY_TARGET: github-pages

    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js for Astro
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Validate public API configuration
        shell: bash
        run: |
          if [[ -z "$PUBLIC_API_URL" ]]; then
            echo '::error::Missing repository Actions variable STUDYBUDDY_API_URL'
            exit 1
          fi

          if [[ -z "$PUBLIC_APP_ENV" ]]; then
            echo '::error::Missing repository Actions variable STUDYBUDDY_APP_ENV'
            exit 1
          fi

          node --input-type=module <<'JS'
          const api = process.env.PUBLIC_API_URL;
          const environment = process.env.PUBLIC_APP_ENV;

          let url;
          try {
            url = new URL(api);
          } catch {
            console.error('::error::Invalid API URL');
            process.exit(1);
          }

          if (
            url.protocol !== 'https:' ||
            url.origin !== api ||
            url.username ||
            url.password ||
            url.hostname.endsWith('.supabase.co') ||
            ['localhost', '127.0.0.1', '::1'].includes(url.hostname)
          ) {
            console.error('::error::API URL must be a plain HTTPS origin');
            process.exit(1);
          }

          if (!['testbed', 'production'].includes(environment)) {
            console.error('::error::Invalid application environment');
            process.exit(1);
          }

          console.log(`API configuration valid for ${environment}.`);
          JS

      - name: Check repository for secrets
        run: node scripts/security-guard.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Check npm vulnerabilities
        run: npm audit --audit-level=high

      - name: Run backend tests
        run: npm test

      - name: Enforce secure demo dependencies
        run: npm run check:demo

      - name: Check API readiness
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --max-time 25 \
            "$PUBLIC_API_URL/api/health" \
            > "$RUNNER_TEMP/studybuddy-health.json"

          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';

          const payload = JSON.parse(
            readFileSync(
              process.env.RUNNER_TEMP + '/studybuddy-health.json',
              'utf8'
            )
          );

          if (
            payload.ok !== true ||
            payload.databaseConfigured !== true ||
            payload.environment !== process.env.PUBLIC_APP_ENV
          ) {
            console.error('::error::StudyBuddy API is not ready.');
            process.exit(1);
          }

          console.log('StudyBuddy API ready.');
          JS

      - name: Build GitHub Pages frontend
        run: npm run build --workspace frontend

      - name: Check frontend asset budget
        run: npm run build:budget

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload static-site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist

  deploy:
    name: Publish approved GitHub Pages artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production
      url: ${{ steps.pages.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Publish approved site
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
